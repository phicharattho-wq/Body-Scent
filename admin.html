<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Body Scent Admin Orders">
  <title>Admin | Body Scent</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand" aria-label="Body Scent Home">Body Scent</a>

      <nav class="nav-links" aria-label="เมนูหลัก">
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section-sm">
      <div class="container">
        <p class="eyebrow">Admin</p>

        <h1 style="font-size:clamp(2.8rem,5vw,4.8rem);">
          รายการคำสั่งซื้อ
        </h1>

        <p class="lead mt-3">
          ข้อมูลคำสั่งซื้อที่บันทึกไว้ในเบราว์เซอร์เครื่องนี้
        </p>
      </div>
    </section>

    <section class="section" style="padding-top:0;">
      <div class="container">
        <div class="card" style="overflow-x:auto;">
          <table id="ordersTable" style="width:100%; border-collapse:collapse; min-width:900px;">
            <thead>
              <tr>
                <th style="text-align:left; padding:1rem; border-bottom:1px solid var(--color-border);">วันเวลา</th>
                <th style="text-align:left; padding:1rem; border-bottom:1px solid var(--color-border);">ชื่อลูกค้า</th>
                <th style="text-align:left; padding:1rem; border-bottom:1px solid var(--color-border);">เบอร์โทร / Line</th>
                <th style="text-align:left; padding:1rem; border-bottom:1px solid var(--color-border);">รายการสินค้า</th>
                <th style="text-align:left; padding:1rem; border-bottom:1px solid var(--color-border);">จำนวนเงินรวม</th>
                <th style="text-align:left; padding:1rem; border-bottom:1px solid var(--color-border);">หมายเหตุ</th>
              </tr>
            </thead>

            <tbody>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
