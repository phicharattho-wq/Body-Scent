<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="สั่งซื้อสินค้า Body Scent">
  <title>Order | Body Scent</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand" aria-label="Body Scent Home">Body Scent</a>

      <nav class="nav-links" aria-label="เมนูหลัก">
        <a href="index.html">Home</a>
        <a href="product.html">Products</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="grid grid-2">

          <div>
            <p class="eyebrow">Complete Your Order</p>
            <h1 style="font-size:clamp(2.8rem,5vw,4.6rem);">
              ยืนยันคำสั่งซื้อ
            </h1>

            <p class="lead mt-3">
              กรอกข้อมูลสำหรับการติดต่อและตรวจสอบรายละเอียดสินค้า
              ก่อนกดยืนยันคำสั่งซื้อ
            </p>

            <div class="divider"></div>

            <p class="text-muted">
              Body Scent จะบันทึกรายการสั่งซื้อจากแบบฟอร์มนี้
              เพื่อใช้แสดงผลในหน้าผู้ดูแลระบบ
            </p>
          </div>

          <div class="card">
            <div class="card-content">
              <form id="orderForm" class="stack">

                <div>
                  <label for="customerName">ชื่อลูกค้า</label>
                  <input
                    type="text"
                    id="customerName"
                    class="form-control mt-2"
                    autocomplete="name"
                    required
                  >
                </div>

                <div>
                  <label for="contact">เบอร์โทร / Line</label>
                  <input
                    type="text"
                    id="contact"
                    class="form-control mt-2"
                    autocomplete="tel"
                    required
                  >
                </div>

                <div>
                  <label for="items">รายการสินค้า</label>
                  <input
                    type="text"
                    id="items"
                    class="form-control mt-2"
                    readonly
                  >
                </div>

                <div>
                  <label for="total">จำนวนเงินรวม</label>
                  <input
                    type="number"
                    id="total"
                    class="form-control mt-2"
                    min="0"
                    step="1"
                    readonly
                  >
                </div>

                <div>
                  <label for="note">หมายเหตุ</label>
                  <textarea
                    id="note"
                    class="form-control mt-2"
                    rows="4"
                    placeholder="เช่น เวลาที่สะดวกให้ติดต่อกลับ"
                  ></textarea>
                </div>

                <button type="submit" class="btn btn-accent">
                  ยืนยันสั่งซื้อ
                </button>

              </form>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="section-sm">
    <div class="container center">
      <div class="divider" style="margin-inline:auto;"></div>
      <p class="brand">Body Scent</p>
      <p class="text-muted mt-2">
        เลือกกลิ่นที่ใช่ เติมความรู้สึกที่เป็นคุณในทุกวัน
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
